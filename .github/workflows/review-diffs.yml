name: Build Review PDFs and Diffs

on:
  push:
    branches: [main]
    tags:
      - "submitted-*"
      - "review-*"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional extra Git tag or commit SHA to diff against HEAD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: review-diffs
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch with full history and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install TeX Live and latexdiff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-plain-generic \
            texlive-science \
            texlive-pictures \
            texlive-bibtex-extra \
            lmodern \
            latexmk \
            latexdiff

      - name: Build clean PDFs and tag-based latexdiff PDFs
        env:
          ENGINE: lualatex
          BASE_REF: ${{ inputs.base_ref }}
          OUT_DIR: dist/review
          RELEASE_TAG: latest-review
        run: bash .github/scripts/build_review_diffs.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-pdfs
          path: dist/review/*.pdf
          retention-days: 30

      - name: Publish rolling GitHub Release (latest-review)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest-review
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force origin "${HEAD_SHA}:refs/tags/${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
            gh release edit "$RELEASE_TAG" \
              --title "Latest Review Draft & Diffs" \
              --notes-file dist/review/RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" dist/review/*.pdf --clobber
          else
            gh release create "$RELEASE_TAG" dist/review/*.pdf \
              --title "Latest Review Draft & Diffs" \
              --notes-file dist/review/RELEASE_NOTES.md
          fi
